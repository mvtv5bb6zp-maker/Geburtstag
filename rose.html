<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Quicksand:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Averia+Libre:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Cause:wght@100..900&family=Chango&family=Coiny&family=Comic+Neue:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Kurale&family=Londrina+Solid:wght@100;300;400;900&family=Oleo+Script:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <title>♡</title>

    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: #fff5f7;
      }
      canvas {
        width: min(90vw, 500px);
        height: min(90vw, 500px);
      }
      .container {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      h1 {
        text-align: center;
        font-family: "Great Vibes", cursive;
        font-size: clamp(3rem, 12vw, 5rem);
        font-weight: 400;
      }
      .text {
        font-family: "Cause", cursive;
        font-size: 20px;
        text-align: center;
        margin: 10px;
      }
      .btn {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      button {
        text-align: center;
        margin: 10px;
        font-family: "Cause", cursive;
        font-size: 20px;
        padding: 10px;
        padding-right: 30px;
        padding-left: 30px;
        background: #e63946;
        border-width: 5px;
        border-color: #e63946;
        border-radius: 10%;
        color: white;
      }
      .input {
        max-width: 190px;
        padding: 0.875rem;
        font-size: 1rem;
        border: 1.5px solid #e9e0e2;
        border-radius: 0.5rem;
        box-shadow: 2.5px 3px 0 #cfc7c9;
        outline: none;
        transition: ease 0.25s;
        margin: 20px;
        color: #000;
        font-family: "Cause", cursive;
      }

      .input:focus {
        box-shadow: 5.5px 7px 0 #cfc7c9;
      }
    </style>
  </head>

  <body>
    <h1>Für dich ☺︎</h1>
    <div class="container">
      <canvas id="canvas"></canvas>
    </div>
    <div class="text">Ein kleines Rätsel:</div>
    <br />
    <div class="text">
      Du magst es, ich aber nicht. Du findest es toll, doch ich mag nur die
      Farbe.
      <input name="text" class="input" id="inp" placeholder="Was ist es?" />
      <button onclick="input()">Prüfen</button>
    </div>

    <script>
      function input() {
        i = document.getElementById("inp");
        if (i.value === "Blaubeere" || i.value === "Heidelbeere") {
          alert("richtig");
          window.location.href = "ende.html";
        } else {
          i.value = "";
        }
      }

      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d");

      function resizeCanvas() {
        const size = Math.min(window.innerWidth * 0.9, 500);

        canvas.width = size;
        canvas.height = size;
      }

      resizeCanvas();

      window.addEventListener("resize", resizeCanvas);

      // Fortschritt der Animation

      let progress = 0;

      // --------------------------------
      // Rose zeichnen
      // --------------------------------

      function drawRose() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const centerX = canvas.width / 2;
        const bottom = canvas.height * 0.85;

        const stemTop = canvas.height * 0.42;

        // -----------------------------
        // Stiel
        // -----------------------------

        ctx.beginPath();

        ctx.moveTo(centerX, bottom);

        const stemProgress = Math.min(progress, 1);

        const currentY = bottom - (bottom - stemTop) * stemProgress;

        ctx.lineTo(centerX, currentY);

        ctx.strokeStyle = "#4caf50";
        ctx.lineWidth = 6;
        ctx.lineCap = "round";

        ctx.stroke();

        // -----------------------------
        // Blätter
        // -----------------------------

        if (progress > 0.6) {
          ctx.beginPath();

          ctx.moveTo(centerX, canvas.height * 0.65);

          ctx.quadraticCurveTo(
            centerX - 70,
            canvas.height * 0.58,
            centerX - 100,
            canvas.height * 0.65,
          );

          ctx.quadraticCurveTo(
            centerX - 60,
            canvas.height * 0.7,
            centerX,
            canvas.height * 0.68,
          );

          ctx.fillStyle = "#66bb6a";

          ctx.fill();
        }

        // -----------------------------
        // Blüte
        // -----------------------------

        if (progress > 1) {
          const flowerProgress = Math.min(progress - 1, 1);

          ctx.save();

          ctx.translate(centerX, stemTop);

          // Äußere Blütenblätter

          for (let i = 0; i < 8; i++) {
            const angle = ((Math.PI * 2) / 8) * i;

            ctx.save();

            ctx.rotate(angle);

            ctx.beginPath();

            ctx.ellipse(
              0,
              -30 * flowerProgress,
              28 * flowerProgress,
              45 * flowerProgress,
              0,
              0,
              Math.PI * 2,
            );

            ctx.fillStyle = "#e63946";

            ctx.fill();

            ctx.restore();
          }

          // Mitte

          ctx.beginPath();

          ctx.arc(0, 0, 25 * flowerProgress, 0, Math.PI * 2);

          ctx.fillStyle = "#c9182b";

          ctx.fill();

          ctx.restore();
        }

        // Animation

        progress += 0.007;

        if (progress < 2) {
          requestAnimationFrame(drawRose);
        }
      }

      drawRose();
    </script>
  </body>
</html>
